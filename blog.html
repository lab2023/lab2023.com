---
layout: posts
title: blog posts
---
<section>
  {% for post in site.posts %}
    <article class="posts row">
      <div class="col-lg-2 col-lg-offset-1">
        <span class="pull-right">{{ post.date | date: "%B %e, %Y" }}</span>
      </div>
      <div class="col-lg-8">
        <h1><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h1>
      </div>
    </article>
  {% endfor %}
</section>
